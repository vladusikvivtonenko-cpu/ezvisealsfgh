name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move root .java files into src/main/java by package
        run: |
          shopt -s nullglob
          for f in *.java; do
            pkg=$(grep -m1 -E '^\s*package\s+[a-zA-Z0-9_.]+\s*;' "$f" | sed -E 's/^\s*package\s+([a-zA-Z0-9_.]+)\s*;.*/\1/')
            if [ -z "$pkg" ]; then pkg="com.ezvisuals"; fi
            dir="src/main/java/$(echo "$pkg" | tr . /)"
            mkdir -p "$dir"
            mv "$f" "$dir/"
          done

      - name: Generate Gradle files for Fabric 1.21.4
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'ezvisuals'
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true
          minecraft_version=1.21.4
          yarn_mappings=1.21.4+build.8
          loader_version=0.16.10
          fabric_version=0.119.3+1.21.4
          mod_version=1.0.0
          maven_group=com.ezvisuals
          archives_base_name=ezvisuals
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'fabric-loom' version '1.9-SNAPSHOT'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
          }

          java {
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          EOF

      - name: Generate fabric.mod.json and mixins json if missing
        run: |
          mkdir -p src/main/resources

          # mixins config
          if ! ls src/main/resources/*.mixins.json >/dev/null 2>&1; then
            ml=$(find src/main/java -name '*Mixin.java')
            if [ -n "$ml" ]; then
              first=$(echo "$ml" | head -1)
              xpkg=$(grep -m1 -E '^\s*package' "$first" | sed -E 's/^\s*package\s+([a-zA-Z0-9_.]+)\s*;.*/\1/')
              names=$(for f in $ml; do echo "\"$(basename "$f" .java)\""; done | paste -sd, -)
              echo "{\"required\":true,\"package\":\"$xpkg\",\"compatibilityLevel\":\"JAVA_21\",\"client\":[$names]}" > src/main/resources/ezvisuals.mixins.json
              echo "mixins json created"
            fi
          fi

          # fabric.mod.json
          if [ ! -f src/main/resources/fabric.mod.json ]; then
            main=$(grep -rl "ClientModInitializer" src/main/java | head -1)
            mpkg=$(grep -m1 -E '^\s*package' "$main" | sed -E 's/^\s*package\s+([a-zA-Z0-9_.]+)\s*;.*/\1/')
            mcls=$(basename "$main" .java)
            mix=""
            if [ -f src/main/resources/ezvisuals.mixins.json ]; then mix=",\"mixins\":[\"ezvisuals.mixins.json\"]"; fi
            echo "{\"schemaVersion\":1,\"id\":\"ezvisuals\",\"version\":\"1.0.0\",\"name\":\"EzVisuals\",\"environment\":\"client\",\"entrypoints\":{\"client\":[\"$mpkg.$mcls\"]}$mix,\"depends\":{\"fabricloader\":\">=0.16.0\",\"minecraft\":\"~1.21.4\",\"java\":\">=21\",\"fabric-api\":\"*\"}}" > src/main/resources/fabric.mod.json
            echo "fabric.mod.json created"
          fi

          cat src/main/resources/fabric.mod.json
          cat src/main/resources/*.mixins.json || true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Build
        run: gradle build --stacktrace

      - name: Show built files
        if: always()
        run: find build -name "*.jar" 2>/dev/null

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
