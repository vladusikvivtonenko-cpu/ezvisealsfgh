name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show files
        run: ls -la

      - name: Move root .java files into src/main/java by package
        run: |
          shopt -s nullglob
          for f in *.java; do
            pkg=$(grep -m1 -E '^\s*package\s+[a-zA-Z0-9_.]+\s*;' "$f" | sed -E 's/^\s*package\s+([a-zA-Z0-9_.]+)\s*;.*/\1/')
            if [ -z "$pkg" ]; then pkg="com.ezvisuals"; fi
            dir="src/main/java/$(echo "$pkg" | tr . /)"
            mkdir -p "$dir"
            mv "$f" "$dir/"
            echo "Moved $f -> $dir/"
          done

      - name: Check sources
        run: |
          count=$(find src/main/java -name '*.java' 2>/dev/null | wc -l)
          echo "Java files found: $count"
          [ "$count" -gt 0 ] || { echo "SOURCES MISSING: no .java files found"; exit 1; }

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew build
          else
            gradle build
          fi

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
