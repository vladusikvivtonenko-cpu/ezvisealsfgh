name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move root .java files into src/main/java by package
        run: |
          shopt -s nullglob
          for f in *.java; do
            pkg=$(grep -m1 -E '^\s*package\s+[a-zA-Z0-9_.]+\s*;' "$f" | sed -E 's/^\s*package\s+([a-zA-Z0-9_.]+)\s*;.*/\1/')
            if [ -z "$pkg" ]; then pkg="com.ezvisuals"; fi
            dir="src/main/java/$(echo "$pkg" | tr . /)"
            mkdir -p "$dir"
            mv "$f" "$dir/"
          done

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew build --stacktrace
          else
            gradle build --stacktrace
          fi

      - name: Show built files
        run: |
          find . -name "*.jar" -not -path "./.gradle/*" -not -path "*/gradle/wrapper/*"
          ls -R build 2>/dev/null | head -100

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: |
            **/build/libs/*.jar
            build/devlibs/*.jar
          if-no-files-found: warn

      - name: Upload whole build folder (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-folder
          path: build/
          if-no-files-found: warn
